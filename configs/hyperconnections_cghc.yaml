model:
  import: hyperconnections.cghc.ContinuousGenHyperConnections
  kwargs:
    n: 4
    m: 1
    input_dim: 6144           # = (n / m) * embed_dim
    embed_dim: 1536
    module:
      import: torch.nn.Identity
      kwargs: {}
    generator_type: conservative_psd_diss
    use_triton: false         # critical: keeps matrix_exp on the ATen path

input:
  shape: [1024, 6144]
  dtype: float32

benchmark:
  warmup: 10
  iters: 50

classes: null

output:
  dir: ./results/cghc
  latex: true
  csv: true
