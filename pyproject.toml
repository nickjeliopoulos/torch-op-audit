[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-arch-op-bench"
version = "0.1"
description = "Per-operator-class FLOP and latency benchmarking for PyTorch nn.Modules"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nick John Eliopoulos" }]
license = { text = "MIT" }
dependencies = [
    "torch>=2.10",
    "pandas>=2.0",
    "omegaconf>=2.3",
    "tabulate>=0.9",
]

[project.optional-dependencies]
timm = ["timm>=0.9"]
dev = ["timm>=0.9"]

[project.scripts]
torch-arch-op-bench = "torch_arch_op_bench.cli:main"

[tool.setuptools.packages.find]
include = ["torch_arch_op_bench*"]
exclude = ["tests*", "scripts*", "configs*"]
